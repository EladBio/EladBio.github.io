<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.data.bio.name }}</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.6; max-width: 760px; margin: 0 auto; padding: 40px 20px;
    }
    h1, h2, h3 { color: var(--heading); margin-bottom: 8px; }
    h1 { font-size: 2rem; }
    .subtitle { color: var(--accent); font-weight: 500; margin-top: 0; }
    .institution { color: #8b949e; margin-top: -6px; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 30px 0; }
    .links a { display: inline-block; margin-right: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>Hi, I'm {{ site.data.bio.name }} 👋</h1>
    <p class="subtitle">{{ site.data.bio.title }}</p>
    <p class="institution">{{ site.data.bio.institution }}</p>
    <div class="links">
      <a href="{{ site.data.bio.links.linkedin }}" target="_blank">LinkedIn</a>
      <a href="{{ site.data.bio.links.email }}">Email</a>
    </div>
  </header>

  <hr>

  <section>
    <p>{{ site.data.bio.summary }}</p>
  </section>

  <section>
    <h3>🔬 What I Do & Explore</h3>
    <ul>
      {% for item in site.data.bio.focus_areas %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </section>

</body>
</html>
